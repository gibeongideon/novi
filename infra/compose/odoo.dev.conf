[options]
; Local development only. Production/tenant configs are generated by the provisioner (P1.5).
db_host = db
db_port = 5432
db_user = odoo
db_password = odoo
data_dir = /var/lib/odoo

; one database per instance, database manager disabled (DECISIONS D-11)
dbfilter = ^novi_demo$
list_db = False
admin_passwd = novi-dev-master-not-for-prod

; workers > 0 starts the gevent websocket server on gevent_port
workers = 2
max_cron_threads = 1
gevent_port = 8072
limit_memory_soft = 1610612736
limit_memory_hard = 2147483648
limit_time_cpu = 600
limit_time_real = 1200

proxy_mode = True
; Odoo 20 listens on 127.0.0.1 by default; containers must listen on all interfaces
http_interface = 0.0.0.0

; outgoing mail goes to Mailpit (http://localhost:8025)
smtp_server = mailpit
smtp_port = 1025

log_level = info
