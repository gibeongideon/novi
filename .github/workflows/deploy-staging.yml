name: Deploy staging (novi.dafeapp.com)

# Every push to main rebuilds the progress dashboard and publishes it to the staging server.
# Server: MT5 server (68.183.91.240); its existing native Caddy serves /opt/novi/progress.
# Static files only (no Docker, no processes) so the trading bots are never affected. See DEPLOYMENT.md.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: staging
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 50 # recent commits shown on the dashboard

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build progress dashboard
        run: node tools/progress-dashboard/build.mjs --out deploy/staging/progress

      - name: Validate deploy secrets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          for v in VPS_HOST VPS_USER VPS_SSH_KEY; do
            [ -n "${!v}" ] || { echo "::error::Missing GitHub secret $v"; exit 1; }
          done
          case "$VPS_SSH_KEY" in
            *"BEGIN OPENSSH PRIVATE KEY"*) ;;
            *) echo "::error::VPS_SSH_KEY does not look like a private key (paste the full output of: cat ~/.ssh/novi_deploy)"; exit 1 ;;
          esac
          [ "$VPS_USER" != "root" ] || { echo "::error::Deploy as the unprivileged 'novi' user, not root"; exit 1; }
          grep -q "^$VPS_HOST " deploy/staging/known_hosts || {
            echo "::error::VPS_HOST ($VPS_HOST) has no verified host key in deploy/staging/known_hosts (expected 68.183.91.240)"; exit 1; }

      # Plain OpenSSH with strict host-key checking against the verified public keys committed in
      # deploy/staging/known_hosts (all key types), so it never connects to an impostor server.
      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          cp deploy/staging/known_hosts ~/.ssh/known_hosts && chmod 644 ~/.ssh/known_hosts

      - name: Upload and publish
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          SSH="ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o BatchMode=yes"
          rsync -a --delete -e "$SSH" deploy/staging/progress/ "$VPS_USER@$VPS_HOST:/opt/novi/incoming/"
          $SSH "$VPS_USER@$VPS_HOST" 'set -eu
            cd /opt/novi
            test -f incoming/index.html
            rm -rf progress.old
            if [ -d progress ]; then mv progress progress.old; fi
            mv incoming progress
            echo "Published: https://novi.dafeapp.com/progress/"'

      - name: Clean up key
        if: always()
        run: rm -f ~/.ssh/deploy_key
