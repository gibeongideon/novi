name: Deploy staging (novi.dafeapp.com)

# Every push to main rebuilds the progress dashboard and publishes it to the staging server.
# Server: MT5 server (68.183.91.240); its existing native Caddy serves /opt/novi/progress.
# Static files only (no Docker, no processes) so the trading bots are never affected. See DEPLOYMENT.md.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: staging
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 50   # recent commits shown on the dashboard

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build progress dashboard
        run: node tools/progress-dashboard/build.mjs --out deploy/staging/progress

      - name: Validate deploy secrets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_FINGERPRINT: ${{ secrets.VPS_FINGERPRINT }}
        run: |
          for v in VPS_HOST VPS_USER VPS_SSH_KEY VPS_FINGERPRINT; do
            [ -n "${!v}" ] || { echo "::error::Missing GitHub secret $v"; exit 1; }
          done
          case "$VPS_SSH_KEY" in
            *"BEGIN OPENSSH PRIVATE KEY"*) ;;
            *) echo "::error::VPS_SSH_KEY does not look like a private key (paste the full output of: cat ~/.ssh/novi_deploy)"; exit 1 ;;
          esac
          case "$VPS_FINGERPRINT" in
            SHA256:*) ;;
            *) echo "::error::VPS_FINGERPRINT must look like SHA256:xxxx (server host key fingerprint)"; exit 1 ;;
          esac
          [ "$VPS_USER" != "root" ] || { echo "::error::Deploy as the unprivileged 'novi' user, not root"; exit 1; }

      - name: Upload dashboard
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          fingerprint: ${{ secrets.VPS_FINGERPRINT }}   # refuse to deploy to an unverified host
          source: "deploy/staging/progress"
          target: "/opt/novi/incoming"
          strip_components: 3
          rm: true

      - name: Publish (swap in new version)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          fingerprint: ${{ secrets.VPS_FINGERPRINT }}
          script: |
            set -euo pipefail
            cd /opt/novi
            test -f incoming/index.html
            rm -rf progress.old
            if [ -d progress ]; then mv progress progress.old; fi
            mv incoming progress
            echo "Published: https://novi.dafeapp.com/progress/"
